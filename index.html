<style>
:root{--sb:#fff;--bg:#f3f5fb;--card:#fff;--tx:#1d2340;--mut:#6b7395;--pri:#5b5bf0;--pri2:#8b5cf6;--ok:#12a36b;--okb:#dcf7ec;--no:#e5484d;--nob:#fde8e8;--bd:#e3e7f3}
:root[data-theme=dark]{--bg:#16171a;--sb:#131417;--card:#0e0f11;--tx:#eceef6;--mut:#9a9fb3;--pri:#6f6ff2;--okb:#0e3b2c;--nob:#3f1a1d;--bd:#2a2c31}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16171a;--sb:#131417;--card:#0e0f11;--tx:#eceef6;--mut:#9a9fb3;--pri:#6f6ff2;--okb:#0e3b2c;--nob:#3f1a1d;--bd:#2a2c31}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}.wrap{max-width:980px;margin:0 auto;padding:16px}
.hero{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-radius:20px;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:14px}
.login{max-width:380px;margin:8vh auto 0}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:6px 0;resize:vertical}
.btn{border:0;border-radius:10px;padding:10px 16px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--no)}.btn.s{padding:6px 10px;font-size:13px}.hero .btn{background:rgba(255,255,255,.2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:26px}.stat span{color:var(--mut);font-size:12px}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#5ee0a8)}
.tabs{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}.tabs button{padding:8px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);cursor:pointer}.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}

.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:top}
.pic{max-width:100%;max-height:320px;border-radius:12px;margin-top:6px;display:block}.chat{max-height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.m{background:var(--bg);border-radius:14px;padding:8px 12px;max-width:85%;align-self:flex-start}.m.me{align-self:flex-end;background:var(--pri);color:#fff}.m small{opacity:.7;display:block}
.chip{display:inline-block;background:var(--nob);color:var(--no);border-radius:99px;padding:2px 10px;margin:2px;font-size:13px}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.menu button{padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;text-align:left}.menu .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mb{flex:none;min-width:0;width:34px;height:34px;padding:0;border-radius:10px;font-size:16px}.hav{flex:none;min-width:0;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;overflow:hidden;cursor:pointer;font-weight:700;font-size:20px;border:2px solid rgba(255,255,255,.6)}.hav img{width:100%;height:100%;object-fit:cover}

.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sb{position:sticky;top:0;height:100vh;background:var(--sb);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px 12px;gap:10px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 6px 12px;border-bottom:1px solid var(--bd)}.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.sb nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}.sb nav button{text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--tx)}
.sb nav button:hover{background:var(--bg)}.sb nav .on{background:color-mix(in srgb,var(--pri) 16%,transparent);color:var(--pri);font-weight:600}
.me{display:flex;align-items:center;gap:10px;border:1px solid var(--bd);border-radius:12px;padding:8px}.me b{display:block;font-size:14px}.me small{color:var(--mut);font-size:12px}
.me .hav{width:38px;height:38px;font-size:15px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}
.sbf button{width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--tx)}.sbf button:hover{background:var(--bg)}
.mainc{min-width:0}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 22px;background:var(--sb);border-bottom:1px solid var(--bd)}
.top input{margin:0;flex:1;max-width:520px}.pill,.ib{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap}.ib{padding:8px 11px}.top .sp{flex:1}.top .mb{display:none}
.page{padding:22px;max-width:1100px}.page h1{margin:0;font-size:26px}.page .sub{margin:2px 0 16px;color:var(--mut)}
.page .card{border-radius:14px;margin-top:0;margin-bottom:14px}.page .card h3{margin:0 0 12px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}.kpi span{color:var(--mut);font-size:13px}.kpi b{display:block;font-size:32px;margin-top:6px}.kpi small{font-size:14px;font-weight:400;color:var(--mut)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}.rt{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}.rt b{font-size:14px}.ring{color:var(--tx)}.rbig{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
@media(max-width:820px){.app{grid-template-columns:1fr}.sb{position:fixed;left:0;top:0;width:260px;transform:translateX(-100%);transition:transform .2s}.sb.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}.top .mb{display:flex;align-items:center;justify-content:center}.top{padding:10px 12px}.page{padding:14px}.pill.yr{display:none}}
@media print{.sb,.top{display:none!important}.app{display:block}.page{padding:0;max-width:none}}
@media print{.hero,.tabs,.noprint{display:none!important}}
.po{display:none}
@page{@bottom-center{content:"Trang " counter(page) " / " counter(pages)}}
@media print{:root{--bg:#fff;--card:#fff;--tx:#000;--mut:#333;--bd:#888}body{background:#fff}.menu,.noprint{display:none!important}.po{display:block}.wrap{max-width:none;padding:0}.card{border:0;padding:0;margin:0 0 8px}thead{display:table-header-group}tr{break-inside:avoid}.pb+.pb{break-before:page}}

<script>
// ===== DÁN 2 GIÁ TRỊ TỪ SUPABASE (Project Settings > API) =====
const SUPABASE_URL='https://atwkawhdjycykisutvek.supabase.co',SUPABASE_KEY='sb_publishable_Mtah1hCJcConaqpE_SPg0g_QbEccusw';
// ===============================================================
const showErr=m=>{document.getElementById('app').innerHTML='<div class="card login"><h3>⚠️ Không mở được app</h3><p style="white-space:pre-wrap">'+String(m).replace(/</g,'&lt;')+'</p></div>'};
var ready=false;window.onerror=m=>{if(!ready)showErr(m)};window.addEventListener('unhandledrejection',e=>{if(!ready)showErr((e.reason&&e.reason.message)||e.reason)});
if(typeof supabase==='undefined')throw new Error('Không tải được thư viện Supabase. Kiểm tra mạng, hoặc trình duyệt/chặn quảng cáo đang chặn cdn.jsdelivr.net.');
if(/DÁN_/.test(SUPABASE_URL+SUPABASE_KEY)||!/^https:\/\/.+\.supabase\.co\/?$/.test(SUPABASE_URL.trim()))throw new Error('Bạn chưa dán đúng Project URL / anon key vào đầu file index.html (Bước 2).\nURL phải có dạng https://xxxx.supabase.co');
const sb=supabase.createClient(SUPABASE_URL.trim(),SUPABASE_KEY.trim()),$=s=>document.querySelector(s),app=$('#app');
let TABS=[],me=null,T=[],SJ=[],RC=[],S=[],SUB=[],V=[],C=[],LG=[],P=[],AS=[],tab='list',flt='all',q='',d={},pf=null,pa=null,msg='',wOff=0,mode='in',timer=null;
const ROLE={pending:'Chờ duyệt',student:'Học sinh',monitor:'Cán bộ lớp',teacher:'Giáo viên',admin:'Quản trị'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const em=u=>u.trim().toLowerCase()+'@lop12b1.vn',staff=()=>me&&['teacher','admin'].includes(me.role),cad=()=>me&&['monitor','teacher','admin'].includes(me.role),nm=()=>me.full_name||me.username;
const pic=u=>u?`<a href="${esc(u)}" target="_blank"><img class="pic" src="${esc(u)}"></a>`:'';
const opts=v=>S.map(x=>`<option value="${x.id}"${x.id==v?' selected':''}>${esc(x.name)}</option>`).join('');
async function boot(){const{data:{session}}=await sb.auth.getSession(),user=session&&session.user;if(!user){me=null;ready=true;return render(1)}
  const{data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error&&!data){app.innerHTML='<div class="card login"><p>Mất kết nối, đang thử lại…</p></div>';return setTimeout(boot,3000)}me=data;
  if(me&&me.role!=='pending'){await load();if(!timer)timer=setInterval(async()=>{if(document.hidden)return;try{await load();render()}catch(e){}},6000)}ready=true;render(1)}
async function load(){
  const g=async(t,o,n)=>(await sb.from(t).select('*').order(o,{ascending:false}).limit(n)).data||[];
  S=(await sb.from('students').select('*').order('ord')).data||[];T=(await sb.from('teams').select('*').order('ord')).data||[];SJ=(await sb.from('subjects').select('*').order('ord')).data||[];RC=await pages('assignment_recipients');SUB=await g('subs','created_at',100);AS=await g('assignments','created_at',500);V=await g('viol','created_at',300);C=(await g('chat','created_at',80)).reverse();
  if(staff()){KEYS=(await sb.from('answer_keys').select('*')).data||[];RES=await pages('results')}
  if(me.role==='admin'){LG=await g('logs','at',200);P=(await sb.from('profiles').select('*').order('created_at')).data||[]}}
function render(f){const a=document.activeElement,id=a&&a.id;if(!f&&a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.dataset.k&&a.value)return;
  app.className=me&&me.role!=='pending'?'':'wrap';app.innerHTML=!me?loginV():me.role==='pending'?pendV():shell();
  if(id){const e=document.getElementById(id);if(e&&e!==a)e.focus()}const c=$('#cl');if(c)c.scrollTop=c.scrollHeight}
function loginV(){const up=mode==='up';return`<div class="card login"><h2 style="text-align:center">🎓 Lớp 12B1</h2>${up?'<input id="n" placeholder="Họ và tên đầy đủ">':''}<input id="u" placeholder="Tên đăng nhập (chữ thường, không dấu)"><input id="p" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" onkeydown="if(event.key==='Enter')auth()"><div class="err">${msg}</div><button class="btn" style="width:100%" onclick="auth()">${up?'Đăng ký':'Đăng nhập'}</button><p class="mut" style="text-align:center"><a href="#" onclick="mode='${up?'in':'up'}';msg='';render(1);return false">${up?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký (cần quản trị duyệt)'}</a></p></div>`}
async function auth(){const u=$('#u').value,p=$('#p').value,up=mode==='up';if(!/^[a-z0-9._]{3,}$/.test(u.trim().toLowerCase())||p.length<6){msg='Tên đăng nhập ≥3 ký tự (a-z, 0-9), mật khẩu ≥6 ký tự';return render(1)}
  let r;if(up){const n=$('#n').value.trim();if(!n){msg='Nhập họ tên';return render(1)}r=await sb.auth.signUp({email:em(u),password:p,options:{data:{full_name:n}}})}else r=await sb.auth.signInWithPassword({email:em(u),password:p});
  if(r.error){msg=up?'Không đăng ký được: '+r.error.message:'Sai tên đăng nhập hoặc mật khẩu';return render(1)}msg='';boot()}
async function logout(){await sb.auth.signOut();clearInterval(timer);timer=null;me=null;render(1)}
function pendV(){return`<div class="card login" style="text-align:center"><div style="font-size:44px">⏳</div><h3>Xin chào ${esc(nm())}</h3><p>Tài khoản đang chờ quản trị viên duyệt. Hãy quay lại sau nhé.</p><button class="btn" onclick="boot()">Kiểm tra lại</button> <button class="btn g" onclick="logout()">Đăng xuất</button></div>`}
/* ===== HERO: ẢNH ĐẠI DIỆN + MỤC LỤC NHỎ Ở GÓC TRÁI ===== */
const menuV=()=>`<div class="card menu"><button onclick="d.mv=d.mv==='acct'?'':'acct';render(1)">⚙️ Tài khoản (đổi tên đăng nhập / mật khẩu)</button><button onclick="$('#avf').click()">🖼 Đổi ảnh đại diện</button></div>${d.mv==='acct'?acctV():''}`;
function resizeAv(f){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const z=256,m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=z;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);c.toBlob(res,'image/jpeg',.8)};im.onerror=()=>rej(new Error('Không đọc được ảnh'));im.src=URL.createObjectURL(f)})}
async function setAv(el){const f=el.files[0];if(!f)return;try{const b=await resizeAv(f),p=me.id+'/avatar_'+Date.now()+'.jpg',u=await sb.storage.from('img').upload(p,b,{contentType:'image/jpeg'});if(u.error)throw u.error;const url=sb.storage.from('img').getPublicUrl(p).data.publicUrl,r=await sb.rpc('set_avatar',{p_url:url});if(r.error)throw r.error;me.avatar_url=url;render(1)}catch(e){alert('Không đổi được ảnh: '+e.message)}}
function head(){const av=me.avatar_url?`<img src="${esc(me.avatar_url)}" alt="">`:esc(((nm()||'?').trim().split(' ').pop()||'?')[0]);
  return`<div class="hero"><div class="row" style="flex-wrap:nowrap;gap:12px;flex:1;min-width:0"><button class="btn mb" title="Mục lục" onclick="d.mn=!d.mn;d.mv='';render(1)">${d.mn?'✕':'☰'}</button><label class="hav" title="Bấm để đổi ảnh đại diện">${av}<input id="avf" type="file" accept="image/*" hidden onchange="setAv(this)"></label><div><h1>📚 Lớp 12B1</h1><p>Xin chào, ${esc(nm())} · ${rl()}${me.title?' · '+esc(me.title):''}</p></div></div><button class="btn" onclick="logout()">Đăng xuất</button></div>`+(d.mn?menuV():'')}

const ring=(p,z=64,c)=>{c=c||(p>=80?'var(--ok)':p>=50?'var(--pri)':'var(--no)');return`<svg class="ring" width="${z}" height="${z}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="3.4"/><circle cx="18" cy="18" r="15.9155" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${p} 100" transform="rotate(-90 18 18)"/><text x="18" y="18" text-anchor="middle" dominant-baseline="central" font-size="8.5" font-weight="700" fill="currentColor">${p}%</text></svg>`};
const curTheme=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('theme',t)}catch(e){}render(1)}
function weekTxt(){const n=new Date(),m=new Date(n);m.setDate(n.getDate()-((n.getDay()+6)%7));const e=new Date(m);e.setDate(m.getDate()+5),f=x=>x.getDate()+'/'+(x.getMonth()+1)+'/'+x.getFullYear();return'Tuần từ '+f(m)+' đến '+f(e)}
function shell(){const body=main(),cur=TABS.find(t=>t[0]===tab)||['',''],ttl=tab==='list'&&!me.role.match(/student/)?'Tổng quan lớp 12B1':cur[1].replace(/ 🔴\d+$/,'').replace(/^\S+\s/,''),n=new Date(),y=n.getMonth()>=7?n.getFullYear():n.getFullYear()-1,
  av=me.avatar_url?`<img src="${esc(me.avatar_url)}" alt="">`:esc(((nm()||'?').trim().split(' ').pop()||'?')[0]);
  return`<div class="app"><aside class="sb${d.mn?' open':''}"><div class="brand"><i></i>Lớp 12B1</div><nav>${TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';msg='';d.mn=0;render(1)">${t[1]}</button>`).join('')}</nav>
  <div class="me"><label class="hav" title="Đổi ảnh đại diện">${av}<input id="avf" type="file" accept="image/*" hidden onchange="setAv(this)"></label><div><b>${esc(nm())}</b><small>${rl()}${me.title?' · '+esc(me.title):''}</small></div></div>
  <div class="sbf"><button onclick="d.mv=d.mv==='acct'?'':'acct';d.mn=0;render(1)">⚙️ Cài đặt tài khoản</button><button onclick="logout()">🚪 Đăng xuất</button></div></aside>
  <div class="mainc"><header class="top"><button class="ib mb" onclick="d.mn=!d.mn;render(1)">☰</button><input id="gq" data-k=1 placeholder="🔍 Tìm học sinh…" value="${esc(q)}" oninput="q=this.value;tab='list';render(1)"><span class="sp"></span><span class="pill">12B1</span><span class="pill yr">${y} - ${y+1}</span><button class="ib" title="Sáng / tối" onclick="toggleTheme()">${curTheme()==='dark'?'☀️':'🌙'}</button></header>
  <main class="page"><h1>${ttl}</h1><p class="sub">${weekTxt()}</p>${d.mv==='acct'?acctV():''}${body}</main></div></div>`}
function stat(){const t=S.length,x=S.filter(s=>s.done).length;return{t,x,n:t-x,p:t?Math.round(x/t*100):0}}
function over(){const s=stat(),vw=V.filter(x=>Date.now()-+new Date(x.created_at)<6048e5).length;return`<div class="kpis"><div class="kpi"><span>Sĩ số lớp</span><b>${s.t}<small> học sinh</small></b></div><div class="kpi"><span>Đã làm bài</span><b style="color:var(--ok)">${s.x}<small> em</small></b></div><div class="kpi"><span>Chưa làm bài</span><b style="color:var(--no)">${s.n}<small> em</small></b></div><div class="kpi"><span>Vi phạm 7 ngày qua</span><b>${vw}<small> lượt</small></b></div></div><div class="panels"><div class="card"><h3>Tỷ lệ hoàn thành của lớp</h3><div class="rbig">${ring(s.p,132)}<div><b>${s.x}/${s.t}</b> học sinh đã làm<br><span class="mut">Còn ${s.n} em chưa làm</span></div></div></div>${tm()}</div>${staff()?sjProg():''}`}
